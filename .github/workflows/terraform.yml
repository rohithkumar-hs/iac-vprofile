name: "Vprofile IAC"

on:
  push:
    branches:
      - main
      - stage
    paths:
      - terraform/**
  pull_request:
    branches:
      - main
    paths:
      - terraform/**

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  BUCKET_TF_STATE: ${{ secrets.BUCKET_TF_STATE }}
  AWS_REGION: us-east-1
  EKS_CLUSTER: vprofile-eks

jobs:
  terraform:
    name: "Terraform Apply"
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ./terraform

    steps:
      # Checkout code
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Install specific Terraform version
      - name: Setup Terraform 1.6.3
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.3"

      # Confirm Terraform version
      - name: Verify Terraform version
        run: terraform version

      # Terraform init with backend config
      - name: Terraform Init
        id: init
        run: terraform init -backend-config="bucket=$BUCKET_TF_STATE" -input=false

      # Terraform fmt check
      - name: Terraform Format
        id: fmt
        run: terraform fmt -check

      # Terraform validate
      - name: Terraform Validate
        id: validate
        run: terraform validate

      # Terraform plan
      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -input=false -out planfile
        continue-on-error: true

      # Fail workflow if plan fails
      - name: Terraform Plan Status
        if: steps.plan.conclusion == 'failure'
        run: exit 1